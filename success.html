<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Exitoso! - Tennis y Mas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="checkout-style.css">
    <style>
        .success-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: radial-gradient(circle at top right, rgba(0, 255, 136, 0.05), transparent),
                radial-gradient(circle at bottom left, rgba(0, 119, 255, 0.05), transparent);
        }

        .success-card {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;

            padding: 3rem;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #00ff88;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .order-id {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-family: monospace;
            color: #00ff88;
            font-size: 1.2rem;
            margin-bottom: 2rem;
            display: inline-block;
        }

        .btn-home {
            background: #fff;
            color: #000;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            background: #eee;
        }
    </style>
</head>

<body class="dark-theme">
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h1>¡Gracias por tu compra!</h1>
            <p>Tu pedido ha sido procesado exitosamente vía Addi. Recibirás un correo de confirmación en unos minutos.
            </p>

            <div id="orderInfo">
                <span class="order-id" id="displayOrderId">#TM-C-LOADING</span>
            </div>

            <p>Pronto nos pondremos en contacto contigo para el envío de tus productos.</p>

            <a href="index.html" class="btn-home">Volver al Inicio</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Get order info from URL if available
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        const displayEl = document.getElementById('displayOrderId');

        function showPaid() {
            document.querySelector('h1').textContent = 'Pago confirmado — ¡Gracias!'
            document.querySelector('p').textContent = 'Tu pago fue aprobado y estamos procesando tu pedido. Recibirás un correo pronto.'
        }

        function showFailed() {
            document.querySelector('h1').textContent = 'Pago no aprobado'
            document.querySelector('p').textContent = 'El pago fue rechazado. Intenta con otra tarjeta o contáctanos para ayudar con el pedido.'
        }

        function showPending() {
            document.querySelector('h1').textContent = 'Procesando pago...'
            document.querySelector('p').textContent = 'Estamos esperando la confirmación del pago. Esto puede tardar unos segundos.'
        }

        if (orderId) {
            displayEl.textContent = '#' + orderId;
            // Poll order status via Supabase REST using global SUPABASE_URL and SUPABASE_KEY
            showPending();
            const SUPABASE_URL = window.SUPABASE_URL || 'https://shbtmkeyarqppasdpzxv.supabase.co'
            const SUPABASE_KEY = window.SUPABASE_KEY || (typeof SUPABASE_KEY !== 'undefined' ? SUPABASE_KEY : '') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYnRta2V5YXJxcHBhc2Rwenh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4NjEzODQsImV4cCI6MjA4NzQzNzM4NH0.Z4Bqo7NHUNs736UBbSG79OEwXEPQvG9ZUrgemLEquGQ'

            let attempts = 0
            const maxAttempts = 20 // ~60s if interval 3s
            const interval = 3000

            const iv = setInterval(async () => {
                attempts++
                try {
                    const r = await fetch(`${SUPABASE_URL}/rest/v1/orders?select=status,status_payment,paid_at,external_reference&external_reference=eq.${orderId}`, {
                        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                    })
                    const text = await r.text()
                    let data = []
                    try { data = JSON.parse(text || '[]') } catch(e){ data = [] }
                    if (data.length > 0) {
                        const o = data[0]
                        if (o.status === 'paid' || (o.status_payment && o.status_payment.toUpperCase()==='APPROVED')) {
                            clearInterval(iv)
                            showPaid()
                            localStorage.removeItem('tm_cart')
                            return
                        }
                        if (o.status === 'cancelled' || (o.status_payment && ['REJECTED','DECLINED','ABANDONED'].includes((o.status_payment||'').toUpperCase()))) {
                            clearInterval(iv)
                            showFailed()
                            return
                        }
                    }
                } catch (err) {
                    console.warn('Polling error', err)
                }

                if (attempts >= maxAttempts) {
                    clearInterval(iv)
                    // leave message as pending but remove cart
                    document.querySelector('p').textContent = 'Estado pendiente. Si el pago se confirma más tarde, actualizaremos tu pedido en el panel.'
                    localStorage.removeItem('tm_cart')
                }
            }, interval)

        } else {
            displayEl.textContent = '#TM-' + Date.now().toString().slice(-6);
            localStorage.removeItem('tm_cart')
        }
    </script>
</body>

</html>
