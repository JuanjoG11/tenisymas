<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Pedido Confirmado! - TENNISYMAS.COM</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css?v=3.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: radial-gradient(circle at top right, #1a1a1a, #000);
            color: #fff;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
        }

        .success-header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.95);
            text-align: center;
        }

        .success-header img {
            height: 45px;
            filter: drop-shadow(0 0 10px rgba(255,51,51,0.3));
        }

        .success-wrapper {
            max-width: 620px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        /* Checkmark animado */
        .success-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2ecc71, #16a34a);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 0 40px rgba(46, 204, 113, 0.35);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .success-icon svg {
            width: 42px;
            height: 42px;
            stroke: #fff;
        }

        .success-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .success-subtitle {
            text-align: center;
            color: #888;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .order-id-badge {
            text-align: center;
            display: inline-block;
            width: 100%;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 32px;
        }

        .order-id-badge span {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 4px 14px;
            font-family: monospace;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* Card de confirmación */
        .confirm-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 20px;
        }

        .confirm-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        /* Items del pedido */
        .order-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .order-item:last-child { border-bottom: none; }

        .order-item-img {
            position: relative;
            width: 58px;
            height: 58px;
            flex-shrink: 0;
        }

        .order-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            background: #1a1a1a;
        }

        .order-item-qty {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #ff3333;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-item-info { flex: 1; }

        .order-item-info h4 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .order-item-info small {
            color: #888;
            font-size: 0.78rem;
        }

        .order-item-price {
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        /* Totales */
        .totals-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.9rem;
            color: #aaa;
        }

        .totals-row.total-final {
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 8px;
            padding-top: 14px;
            color: #fff;
            font-size: 1.05rem;
            font-weight: 800;
        }

        .totals-row.total-final .total-amount {
            color: #2ecc71;
            font-size: 1.2rem;
        }

        /* Info del cliente */
        .info-row {
            display: flex;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            font-size: 0.88rem;
        }

        .info-row:last-child { border-bottom: none; }

        .info-label {
            color: #666;
            min-width: 110px;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value { color: #e0e0e0; }

        /* Botones */
        .btn-success {
            display: block;
            width: 100%;
            padding: 17px;
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            border: none;
            margin-bottom: 12px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-success:active { transform: scale(0.98); }

        .btn-primary-success {
            background: linear-gradient(90deg, #ff3333, #cc0000);
            color: #fff;
        }

        .btn-secondary-success {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            color: #ccc;
        }

        /* Banner de envío */
        .shipping-banner {
            background: linear-gradient(135deg, rgba(46,204,113,0.1), rgba(22,163,74,0.08));
            border: 1px solid rgba(46,204,113,0.25);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .shipping-banner svg {
            width: 28px;
            height: 28px;
            stroke: #2ecc71;
            flex-shrink: 0;
        }

        .shipping-banner p {
            font-size: 0.88rem;
            color: #aaa;
            margin: 0;
        }

        .shipping-banner strong { color: #2ecc71; }

        /* Estado vacío / error */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state a {
            color: #ff3333;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header class="success-header">
        <a href="index.html">
            <img src="images/logo-tm.png" alt="Tennis y Mas">
        </a>
    </header>

    <main class="success-wrapper">

        <!-- Ícono animado -->
        <div class="success-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1 class="success-title">¡Pedido Confirmado!</h1>
        <p class="success-subtitle">Gracias por tu compra. Estamos preparando tu pedido.</p>
        <p class="order-id-badge"><span id="orderIdDisplay">—</span></p>

        <!-- Banner de tiempo de envío -->
        <div class="shipping-banner">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
            </svg>
            <p>Tu pedido llegará en <strong>3 a 5 días hábiles</strong>. Recibirás novedades por WhatsApp.</p>
        </div>

        <!-- Resumen del pedido -->
        <div class="confirm-card" id="itemsCard">
            <h3>Resumen del pedido</h3>
            <div id="orderItemsList">
                <!-- Renderizado por JS -->
            </div>
            <div style="margin-top: 16px;">
                <div class="totals-row">
                    <span>Subtotal</span>
                    <span id="displaySubtotal">—</span>
                </div>
                <div class="totals-row" id="discountRowWrapper" style="display:none;">
                    <span id="discountLabel">Descuento</span>
                    <span id="displayDiscount" style="color: #2ecc71;">—</span>
                </div>
                <div class="totals-row">
                    <span>Envío</span>
                    <span id="displayShipping">—</span>
                </div>
                <div class="totals-row total-final">
                    <span>Total</span>
                    <span class="total-amount" id="displayTotal">—</span>
                </div>
            </div>
        </div>

        <!-- Datos de contacto / envío -->
        <div class="confirm-card" id="customerCard" style="display:none;">
            <h3>Información de envío</h3>
            <div id="customerInfo"><!-- Renderizado por JS --></div>
        </div>

        <!-- Botones de acción -->
        <a href="collections.html" class="btn-success btn-primary-success">Seguir comprando</a>
        <a href="https://wa.me/573204961453" target="_blank" rel="noopener" class="btn-success btn-secondary-success">
            Contactar por WhatsApp
        </a>

    </main>

    <script>
        const SHIPPING_COST = 20000;
        const FREE_SHIPPING_THRESHOLD = 300000;

        document.addEventListener('DOMContentLoaded', () => {
            // Leer orderId de la URL
            const params = new URLSearchParams(window.location.search);
            const orderId = params.get('orderId') || params.get('order_id') || params.get('preference_id') || null;

            if (orderId) {
                document.getElementById('orderIdDisplay').textContent = orderId;
            } else {
                document.getElementById('orderIdDisplay').textContent = 'Pedido registrado';
            }

            // Cargar datos del carrito guardados en localStorage
            const savedCart = localStorage.getItem('tm_cart');
            const savedCustomer = localStorage.getItem('tm_last_customer');
            const savedDiscount = sessionStorage.getItem('tm_discount');

            if (savedCart) {
                try {
                    const cart = JSON.parse(savedCart);
                    renderItems(cart, savedDiscount ? JSON.parse(savedDiscount) : null);
                } catch (e) {
                    console.warn('No se pudo parsear el carrito:', e);
                }
            }

            if (savedCustomer) {
                try {
                    const customer = JSON.parse(savedCustomer);
                    renderCustomer(customer);
                } catch (e) {
                    console.warn('No se pudo parsear el cliente:', e);
                }
            }

            // Limpiar carrito después de mostrar la confirmación
            localStorage.removeItem('tm_cart');
            sessionStorage.removeItem('tm_discount');
        });

        function renderItems(cart, discount) {
            const listEl = document.getElementById('orderItemsList');
            if (!cart || cart.length === 0) return;

            let subtotal = 0;

            listEl.innerHTML = cart.map(item => {
                let priceValue = typeof item.price === 'number'
                    ? item.price
                    : parseInt(String(item.price).replace(/[^0-9]/g, '')) || 0;

                const itemTotal = priceValue * item.quantity;
                subtotal += itemTotal;

                return `
                    <div class="order-item">
                        <div class="order-item-img">
                            <img src="${item.image || 'images/placeholder.png'}" alt="${item.name}" onerror="this.src='images/logo-tm.png'">
                            <span class="order-item-qty">${item.quantity}</span>
                        </div>
                        <div class="order-item-info">
                            <h4>${item.name}</h4>
                            <small>${item.size ? 'Talla: ' + item.size : ''}${item.size && item.color ? ' · ' : ''}${item.color ? 'Color: ' + item.color : ''}</small>
                        </div>
                        <div class="order-item-price">$${itemTotal.toLocaleString('es-CO')}</div>
                    </div>
                `;
            }).join('');

            const shipping = subtotal >= FREE_SHIPPING_THRESHOLD ? 0 : SHIPPING_COST;
            const discountPercent = (discount && discount.percent) ? discount.percent : 0;
            const discountAmount = Math.round(subtotal * (discountPercent / 100));
            const total = subtotal - discountAmount + shipping;

            document.getElementById('displaySubtotal').textContent = `$${subtotal.toLocaleString('es-CO')}`;

            if (discountAmount > 0) {
                const drw = document.getElementById('discountRowWrapper');
                drw.style.display = 'flex';
                document.getElementById('discountLabel').textContent = `Descuento (${discount.code})`;
                document.getElementById('displayDiscount').textContent = `-$${discountAmount.toLocaleString('es-CO')}`;
            }

            document.getElementById('displayShipping').innerHTML = shipping === 0
                ? '<span style="color:#2ecc71;font-weight:700;">GRATIS</span>'
                : `$${shipping.toLocaleString('es-CO')}`;

            document.getElementById('displayTotal').textContent = `$${total.toLocaleString('es-CO')}`;
            document.getElementById('itemsCard').style.display = 'block';
        }

        function renderCustomer(c) {
            const el = document.getElementById('customerInfo');
            const rows = [
                { label: 'Nombre', value: `${c.firstName || ''} ${c.lastName || ''}`.trim() },
                { label: 'Cédula', value: c.dni || '—' },
                { label: 'Dirección', value: c.address || '—' },
                { label: 'Ciudad', value: c.city && c.department ? `${c.city}, ${c.department}` : (c.city || c.department || '—') },
                { label: 'Teléfono', value: c.phone || '—' },
                { label: 'Correo', value: c.email || '—' },
            ];

            el.innerHTML = rows
                .filter(r => r.value && r.value !== '—' && r.value.trim() !== '')
                .map(r => `
                    <div class="info-row">
                        <span class="info-label">${r.label}</span>
                        <span class="info-value">${r.value}</span>
                    </div>
                `).join('');

            document.getElementById('customerCard').style.display = 'block';
        }
    </script>
</body>
</html>
