<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busos Marca Propia | TENNISYMAS</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="buritica-style.css">
    <link rel="stylesheet" href="collections-style.css?v=18.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script>window.addiAllySlug = "tennisymasco-ecommerce";</script>
    <style>
        /* ── OVERRIDE buritica slides para que funcionen bien ── */
        .gallery-slide {
            position: absolute; width: 100%; height: 100%;
            background-size: cover; background-position: center;
            opacity: 0; transform: scale(1.05);
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 1; clip-path: none !important; filter: none !important;
        }
        .gallery-slide.active { opacity: 1; transform: scale(1); z-index: 2; clip-path: none !important; filter: none !important; }

        /* ── BOTTOM BAR ── */
        .buy-bar {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
            background: rgba(8,8,8,0.95); border-top: 1px solid rgba(255,255,255,0.08);
            padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
            gap: 14px; backdrop-filter: blur(14px);
        }
        .buy-bar .price { font-size: 1.4rem; font-weight: 900; color: #fff; white-space: nowrap; }
        .buy-bar .btn-open-modal {
            background: #ff3333; color: white; border: none;
            padding: 14px 28px; border-radius: 50px;
            font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,51,51,0.4);
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .buy-bar .btn-open-modal:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(255,51,51,0.6); }

        /* ── DOTS & NAV ── */
        .gallery-dots {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 20;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); cursor: pointer; transition: all 0.3s; border: none; }
        .dot.active { background: #ff3333; width: 24px; border-radius: 4px; }
        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15);
            color: white; width: 48px; height: 48px; border-radius: 50%;
            font-size: 1.1rem; cursor: pointer; z-index: 20; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { background: #ff3333; border-color: #ff3333; }
        .prev-btn { left: 16px; } .next-btn { right: 16px; }
    </style>
</head>
<body id="collectionPage">

    <span>Volver a la Tienda</span>
</a>

        <div class="gallery-slide" style="background-image: url('images/buso4.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso5.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso6.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso7.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso8.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso9.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso10.jpeg')"></div>
        <div class="gallery-slide" style="background-image: url('images/buso11.jpeg')"></div>
    </div>
    <div class="gallery-overlay"></div>

    <section class="gallery-content">
        <div class="text-top">
            <div style="display:inline-flex;align-items:center;gap:6px;background:#ff3333;color:white;font-size:0.72rem;font-weight:900;padding:5px 14px;border-radius:50px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;">⚡ NUEVO LANZAMIENTO</div>
            <h1 class="main-title">BUSOS<br>MARCA PROPIA</h1>

    <button class="nav-btn prev-btn" onclick="rotateGallery(-1)">&#10094;</button>

    <div class="gallery-dots" id="galleryDots"></div>
</main>
